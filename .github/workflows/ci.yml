name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token by default; a job that pushes raises it for itself.
# Actions are pinned to a commit SHA (tags can move); Dependabot keeps the pins current.
permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fallow:check
      - run: pnpm security
      # Network-bound and fails on advisories unrelated to the change, so CI only, not verify
      - run: pnpm audit --prod --audit-level high

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm test --coverage
      - name: Fallow (changed files)
        if: github.event_name == 'pull_request'
        run: pnpm fallow
      - name: Fallow (full)
        if: github.event_name != 'pull_request'
        run: pnpm fallow:full
      # Badges are built here, not in the badges job, so no dependency code runs next to its write token
      - name: Badges
        if: github.event_name == 'push'
        run: |
          node scripts/coverage-badge.mjs
          pnpm exec fallow health --score --format badge --coverage coverage/coverage-final.json > .github/badges/fallow-health.svg
          pnpm security --badge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: badges
          path: .github/badges/
          include-hidden-files: true
          retention-days: 1

  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Generate architecture diagrams
        run: pnpm arch:diagram
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: architecture-diagrams
          path: reports/
          retention-days: 14

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:54322/postgres
      BETTER_AUTH_SECRET: dummy-secret-dummy-secret-dummy-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-
      - run: pnpm build
      # Dependabot bumps the base image; this catches a Dockerfile that no longer builds
      - run: docker build .

  badges:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Keeps its credentials: this job pushes the badge commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: badges
          path: .github/badges
      - name: Commit badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg .github/badges/fallow-health.svg .github/badges/security-accepted.svg
          git diff --staged --quiet || git commit -m "chore(ci): update badges [skip ci]"
          git push
