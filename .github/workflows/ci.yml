name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token by default; a job that pushes raises it for itself.
# Actions are pinned to a commit SHA (tags can move); Dependabot keeps the pins current.
permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fallow:check
      - run: pnpm security
      # Network-bound and fails on advisories unrelated to the change, so CI only, not verify
      - run: pnpm audit --prod --audit-level high

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm test --coverage
      - name: Fallow (changed files)
        if: github.event_name == 'pull_request'
        run: pnpm fallow
      - name: Fallow (full)
        if: github.event_name != 'pull_request'
        run: pnpm fallow:full
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'push'
        with:
          name: coverage
          path: coverage/
          retention-days: 1

  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Generate architecture diagrams
        run: pnpm arch:diagram
      - name: Install graphviz
        run: sudo apt-get install -y graphviz
      - name: Render actual-dependency SVG
        run: dot -Tsvg reports/dependency-graph.dot -o reports/dependency-graph.svg
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: architecture-diagrams
          path: reports/
          retention-days: 14

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:54322/postgres
      BETTER_AUTH_SECRET: dummy-secret-dummy-secret-dummy-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-
      - run: pnpm build

  badges:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Keeps its credentials: this job pushes the badge commit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: true
      - uses: $/.github/actions/setup
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: coverage
          path: coverage
      - name: Coverage badge
        run: node scripts/coverage-badge.mjs
      - name: Fallow health badge
        run: pnpm exec fallow health --score --format badge --coverage coverage/coverage-final.json > .github/badges/fallow-health.svg
      - name: Accepted security risks badge
        run: pnpm security --badge
      - name: Commit badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          git diff --staged --quiet || git commit -m "chore(ci): update badges [skip ci]"
          git push
