services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # localhost only: the password is public, so the LAN must not reach this port
      - "127.0.0.1:54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    # lets `docker compose up --wait` block until Postgres accepts connections
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 30

volumes:
  postgres_data:
