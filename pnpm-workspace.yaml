# Supply chain: skip versions younger than a day (strict once set explicitly), and fail when a
# package loses trust evidence it had, e.g. trusted publishing. security-wiring.test.ts pins both.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
catalog:
  "@testing-library/react": ^16.3.3
  "@types/react": 19.3.0
  typescript: npm:typescript@~6.0.3
  vite-plus: 1.6.0
overrides:
  vite@*: "npm:@voidzero-dev/vite-plus-core@1.6.0"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
